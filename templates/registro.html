<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container auth-container">
        <h1>📝 Mis Tareas</h1>
        <p class="auth-subtitle">Crea tu cuenta</p>

        <div id="error-msg" class="error-msg"></div>
        <div id="success-msg" class="success-msg"></div>

        <div class="auth-form">
            <input type="text" id="username" placeholder="Usuario" />
            <input type="password" id="password" placeholder="Contraseña" />
            <input type="password" id="password2" placeholder="Confirmar contraseña" />
            <button onclick="registrarse()">Crear cuenta</button>
        </div>

        <p class="auth-link">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
    </div>

    <script>
        async function registrarse() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();
            const password2 = document.getElementById("password2").value.trim();
            const errorMsg = document.getElementById("error-msg");
            const successMsg = document.getElementById("success-msg");

            errorMsg.style.display = "none";
            successMsg.style.display = "none";

            if (!username || !password || !password2) {
                errorMsg.textContent = "Completa todos los campos";
                errorMsg.style.display = "block";
                return;
            }

            if (password !== password2) {
                errorMsg.textContent = "Las contraseñas no coinciden";
                errorMsg.style.display = "block";
                return;
            }

            const res = await fetch("/registro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                successMsg.textContent = "¡Cuenta creada! Redirigiendo...";
                successMsg.style.display = "block";
                setTimeout(() => window.location.href = "/login", 1500);
            } else {
                const data = await res.json();
                errorMsg.textContent = data.error;
                errorMsg.style.display = "block";
            }
        }
    </script>
</body>
</html>
